#++
#  DESCRIPTION: Settings for the Network-to-Serial gateway
#
#  AUTHOR: StarLet Squad and Ruslan R. Laishev (AKA: BadAss sysman)
#
#  CREATION DATE: 11-FEB-2026
#
#  MODIFICATION  HISTORY:
#
#	25-AUG-2026	RRL	X.00-05: <flow> is really supported now (NONE, XON/XOFF, RTS/CTS);
#				<connlm> is documented as what it really is - a backlog of the
#				listening socket, NOT a count of the simultaneous clients: a serial
#				line is given to a SINGLE session at a time (see the User Guide);
#				the allowed ranges of every parameter are given below.
#
#--


listeners = (					# A listeners to accept remote request, pass to local device, and return response
	{
	bind = "TCP:0.0.0.0:502";		# Listen on the port TCP #502. Port range: 1..65535,
						# 0.0.0.0 - every interface. UDP is not supported.
	connlm = 8;				# A backlog of the listening socket, 1..128
	iotmo = 5000;				# A timeout for network I/O operations, milliseconds, 1..600000
	target = "/dev/ttyUSB0";		# Target serial (must be defined in the <serials> section!)
	},

	{bind = "TCP:0.0.0.0:503"; connlm = 8; iotmo = 5000; target = "/dev/ttyUSB1";}
	# , {bind = "TCP:0.0.0.0:504"; connlm = 8; iotmo = 5000; target = "/dev/ttyS0";}
);



serials = (
	{	desc = "MicroVAX 3100 OPA0: Console";
		device = "/dev/ttyUSB0";	# OS device name, eg: /dev/ttyS0, /dev/ttyUSB0 ...
		chars = "9600, 8, N, 1";	# <Speed, bits in byte, parity checking, stop bits>
						# Speed: 50..4000000, bits: 5..8, parity: N|E|O, stop bits: 1..2
		flow = "NONE";			# Flow control: NONE, XON/XOFF, RTS/CTS
		iotmo = 5000;			# I/O timeout, milliseconds (msec-s), 1..600000

		rs485 = 0;			# 1: Enable RS485 specific support
	},

	{	desc = "Cisco Catalist 1900 Console";
		device = "/dev/ttyUSB1";
		chars = "9600, 8, N, 1";
		flow = "RTS/CTS";		# The Cisco console cable does the hardware handshake
		iotmo = 5000;

		rs485 = 0;
	}

);
